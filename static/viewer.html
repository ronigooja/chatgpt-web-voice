<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Upstream viewer · Voice Gateway</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script>
    try {
      var theme = localStorage.getItem('chatgpt_web_voice_theme_v1');
      if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  </script>
  <style>
    .viewer-page { position: relative; display: flex; flex-direction: column; min-height: 75vh; }
    .viewer-pane { min-height: 200px; }
    .caption-log-line { display: flex; gap: 12px; margin-bottom: 20px; }
    .caption-log-line.user { flex-direction: row-reverse; }
    .message-avatar { border-radius: 50%; background: var(--green-soft); color: var(--green-dark); padding: 6px 10px; height: fit-content; }
    .message-body { min-width: 0; max-width: 85%; }
    .message-meta { color: var(--muted); font-size: 12px; }
    .message-bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
    .header-toast { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px; background: var(--toast-bg); }
    .header-toast.show { display: block; }
    .viewer-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .viewer-bar .viewer-kv { display: inline-flex; gap: 5px; align-items: baseline; min-width: 0; }
    .viewer-bar .viewer-k { color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; font-weight: 700; }
    .viewer-bar .viewer-v { color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; }
    .viewer-bar select, .viewer-bar input[type="search"], .viewer-filters select, .viewer-filters button, .viewer-tabs button {
      min-height: 30px; padding: 4px 9px; border: 1px solid var(--line-strong); border-radius: 8px;
      color: var(--ink); background: var(--input-bg); font: inherit; font-size: 12px;
    }
    .viewer-tabs { display: flex; gap: 6px; padding: 10px 18px 0; }
    .viewer-tabs button[aria-selected="true"] { background: var(--surface-3); }
    .viewer-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 18px; }
    .viewer-pane { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px; }
    .viewer-pane[hidden] { display: none; }
    .viewer-notice { margin: 10px 18px 0; padding: 10px 12px; border: 1px solid var(--red); border-radius: 10px; background: var(--red-soft); color: var(--red); font-size: 12px; white-space: pre-line; }
    .viewer-notice[hidden] { display: none; }
    .viewer-notice[data-kind="warn"] { color: var(--ink); }
    .viewer-creation { margin: 10px 18px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 12px; }
    .viewer-creation[hidden] { display: none; }
    .viewer-creation summary { padding: 8px 12px; color: var(--muted); cursor: pointer; }
    .viewer-creation pre { margin: 0; padding: 0 12px 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; }
    .viewer-boundary { margin: 14px 0; padding-top: 8px; border-top: 1px dashed var(--line-strong); color: var(--dim); font-size: 11px; text-align: center; }
    .viewer-gap { margin: 8px 0; padding: 6px 10px; border-radius: 8px; background: var(--red-soft); color: var(--red); font-size: 12px; }
    .viewer-event { padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
    .viewer-event-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .viewer-badge { padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); font-size: 11px; }
    .viewer-badge.warn { color: var(--red); border-color: var(--red); }
    .viewer-badge.dir-upstream_to_client { color: var(--green-bright); }
    .viewer-badge.dir-gateway_creation { color: var(--muted); }
    .viewer-type { color: var(--ink); font-weight: 600; }
    .viewer-meta { color: var(--dim); font-size: 11px; }
    .viewer-payload { margin-top: 6px; }
    .viewer-payload summary { color: var(--muted); cursor: pointer; font-size: 11px; }
    .viewer-pre { margin: 6px 0 0; max-height: 360px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; }
    .viewer-follow { position: absolute; right: 22px; bottom: 16px; }
    .viewer-follow[hidden] { display: none; }
     .caption-log-line.pending .caption-log-content::after { content: " …"; color: var(--dim); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/sessions"><span class="brand-mark">SS</span><span class="brand-title">Upstream viewer</span></a>
    <div class="top-actions"><span id="vwOrb" class="orb idle" aria-hidden="true"></span><span id="vwConn">Loading</span><span>Read-only</span><button type="button" id="vwTheme" class="header-chip" aria-label="Toggle theme">Dark</button><a class="nav-link" href="/sessions">Sessions</a><a class="nav-link" href="/voice">Voice</a></div>
  </header>
  <main id="viewerPage" class="layout viewer-page" aria-label="Upstream context viewer">
    <div class="viewer-bar">
      <span class="viewer-kv"><span class="viewer-k">Session</span><span id="vwSession" class="viewer-v">—</span></span>
      <span class="viewer-kv"><span class="viewer-k">Zoe</span><span id="vwZoe" class="viewer-v">—</span></span>
      <span class="viewer-kv"><span class="viewer-k">Gen</span><span id="vwGen" class="viewer-v">—</span></span>
      <label class="viewer-kv"><span class="viewer-k">Generation</span>
        <select id="vwGenSelect" aria-label="Generation"></select>
      </label>
      <span id="vwStatus" class="viewer-v">—</span>
    </div>
    <div id="vwNotice" class="viewer-notice" role="alert" hidden></div>
    <details id="vwCreation" class="viewer-creation" hidden>
      <summary>Creation (instructions and initial items)</summary>
      <pre id="vwCreationBody"></pre>
    </details>
    <div class="viewer-tabs" role="tablist">
      <button type="button" id="vwTabCaptions" role="tab" aria-selected="true">Captions</button>
      <button type="button" id="vwTabEvents" role="tab" aria-selected="false">Events</button>
    </div>
    <div class="viewer-filters">
      <select id="vwDirection" aria-label="Filter by direction">
        <option value="">All directions</option>
        <option value="upstream_to_client">upstream → client</option>
        <option value="client_to_upstream">client → upstream</option>
        <option value="gateway_to_upstream">gateway → upstream</option>
        <option value="gateway_creation">creation</option>
      </select>
      <select id="vwType" aria-label="Filter by type"><option value="">All types</option></select>
      <button type="button" id="vwCopy">Copy visible JSON</button>
    </div>
    <section id="vwCaptionsPane" class="viewer-pane" role="tabpanel" aria-label="Captions">
      <div id="vwCaptions" class="transcript-list" aria-live="off"></div>
    </section>
    <section id="vwEventsPane" class="viewer-pane" role="tabpanel" aria-label="Events" hidden>
      <div id="vwEvents"></div>
    </section>
    <button type="button" id="vwFollow" class="btn-ghost viewer-follow">Jump to latest</button>
    <div id="vwToast" class="header-toast" role="status" aria-live="polite"></div>
  </main>
  <script src="/static/captions.js"></script>
  <script src="/static/voice-view.js"></script>
  <script>window.ZoeViewer.start();</script>
</body>
</html>
